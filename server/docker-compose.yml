services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    ports:
      - "5432:5432"
    volumes:
      - beacon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://beacon:beacon@db:5432/beacon
      # Required in production. Generate keys with `npm run keys -- --write` (writes server/.env).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in server/.env}
      BACKEND_ENC_PRIVATE_KEY: ${BACKEND_ENC_PRIVATE_KEY:?run npm run keys -- --write}
      BACKEND_SIGN_PRIVATE_KEY: ${BACKEND_SIGN_PRIVATE_KEY:?run npm run keys -- --write}
      SENDER_HASH_SALT: ${SENDER_HASH_SALT:-}
      NEMOTRON_BASE_URL: ${NEMOTRON_BASE_URL:-}
      NEMOTRON_API_KEY: ${NEMOTRON_API_KEY:-}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nvidia/nemotron}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-beacon-demo}
    restart: unless-stopped

volumes:
  beacon-pg:
