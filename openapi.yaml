openapi: 3.1.0
info:
  title: Beacon API
  version: 1.0.0
  summary: "Disaster-response backend for offline mesh SOS and the responder dashboard. App-only, every victim uses the Android app."
  description: |
    Contract between the Android app, responder dashboard, and the Express + Postgres backend.
    Treat this as final: clients can be built and mocked (e.g. `prism mock openapi.yaml`) before the server exists.

    ## Deployment
    One server process hosts both the API and the responder dashboard (React build served as static files at `/`, SPA fallback to `index.html`
    for any non-`/v1` path). The dashboard is therefore same-origin: it calls relative `/v1/...` URLs and `wss://<same-host>/v1/ws`, no CORS needed.
    The Android app uses the same public base URL. CORS is only required for local dev (frontend dev server on another port).

    ## Liveness, layer A: automatic heartbeats (no human action, ever)
    Every installed app sends a tiny signed heartbeat on its own, in the background, every `heartbeat_interval_seconds` (from `/server-info`, default 300 s;
    available with or without an event): directly via `POST /heartbeats` when online, otherwise as a `kind=heartbeat` mesh envelope (tier `heartbeat`,
    2 hops, 30 min TTL) that gateways upload through `POST /sos/batch`. **No person ever presses a button for this.** Receiving a heartbeat IS the
    check-in; the server records the device's last heartbeat (time, transport, battery, network, peers nearby) and exposes it as `connectivity`
    (`connected | quiet | lost_contact | unknown`).

    **The absence of heartbeats means the device has no connectivity.** It is a lost-contact signal, not proof of distress. A device that merely
    left coverage and has no open SOS is only listed as `lost_contact`/`quiet` (and in `GET /heartbeats/silent`); it never becomes a case and is never
    escalated. For a device with an OPEN SOS, silence raises priority (it never lowers it): after `silence_threshold_seconds` without any message from
    that device (heartbeat, SOS, offer, check-in reply) the case becomes `silent` with `contact_state=lost_contact`, a reason
    "Lost contact: no heartbeat for N min (device probably has no connectivity)" and +10 score at the threshold, +10 per further missed heartbeat
    interval, at most +30 (`sos.silent` WebSocket event). The next heartbeat restores it (`silent=false`, a `contact_restored` event, `sos.updated`);
    the score is NOT reduced. Apps MUST keep heartbeating whenever they have an open SOS, even if no event is active. Responders can promote a silent
    device to a case. Heartbeats stop when the event closes (unless an SOS is open) and are purged with the event.

    ## Liveness, layer B: welfare check-ins (a person is asked, only while they have an open SOS)
    Once a person has filed an SOS (open case, status not `resolved`/`closed`/`merged`, category not `safe`) the server periodically asks them to confirm
    their status: every 10 min for `critical` cases, 15 min for `high`, 30 min for `normal` (`/server-info.checkin_intervals_seconds`; measured from the last answer).
    Each `Checkin` has `choices` (`still_here` "I'm still here", `no_longer_need_help` "I no longer need help", `need_urgent_help` "I need help urgently"),
    `deadline_at` (= `sent_at` + `checkin_window_seconds`, default 5 min) and `alarm_at` (= `deadline_at` - `checkin_alarm_lead_seconds`, default 60 s).
    Order of events: check-in created -> notification (mesh `BackendMessage` kind `checkin_request`, push notification when the device has a `push_token`,
    and REST: `pending_checkins` in the `POST /heartbeats` response and `GET /checkins/pending`) -> **at `alarm_at`, if still unanswered, the APP sounds a
    local alarm + vibration + full-screen alert as a final try** (the server cannot reach an offline phone, so this is done by the app from the timestamps)
    -> `deadline_at` passes -> the server marks the check-in `missed`; ONLY NOW is the case `silent`. The server never marks a case silent before `deadline_at`.
    A missed check-in is interpreted together with the heartbeats: heartbeats still arriving = `contact_state=unresponsive` (connected but not answering,
    possible incapacitation, the stronger signal; +20 score for that miss); heartbeats also stopped = `contact_state=lost_contact` (+10). The welfare boost
    is capped at +30 on top of the heartbeat-gap boost (also capped at +30); the total never exceeds 100 and priority never decreases. A reply or heartbeat
    restores `silent=false` (`contact_restored` event) without lowering the score; a case with unanswered check-ins stays `unresponsive` until the person answers.
    Replies: `still_here` = confirmed, timer restarts, no score change; `no_longer_need_help` = the case becomes `resolved` by the requester
    (assignment `outcome=self_resolved`, audit event `self_resolved`, `sos.updated` + `assignment.updated` WebSocket events, `status_update` message
    "Marked as resolved. Stay safe." back to the phone; responders can reopen with `PATCH /sos/{id}` `status=reported`); `need_urgent_help` = +15 score
    (cap +30) with a reason and `sos.updated`. A reply also counts as a heartbeat. Legacy values `ok`, `need_help` (= `need_urgent_help`) and `other` (= `still_here`) are accepted.

    ## Delivery to victims (app-only)
    There are no non-app channels. Welfare check-ins and status updates ("Help is on the way, ETA 40 min") reach the phone as notifications by push token
    when online (needs Firebase credentials on the server), via `pending_checkins` in the heartbeat response, by polling `GET /checkins/pending` and
    `GET /sos/{id}/status`, and over the mesh as small signed backend messages when the phone is offline (same mechanism as DELIVERED receipts). Apps
    also raise LOCAL notifications from the REST/mesh delivery so check-ins work without push. The app should poll whenever it regains signal.

    ## AI triage
    Rules score first; free text is then sent to a Nemotron model (NVIDIA NIM, OpenAI-compatible endpoint hosted on Brev) which extracts
    entities and adds reasons. The LLM endpoint is internal to the server and not part of this API.

    ## Profiles (who is the person behind the phone)
    At install the app asks for the user's name and identifying characteristics and syncs them with `PUT /devices/{deviceId}/profile` (device signature
    auth). Sync strategy for apps: (1) fetch `GET /server-info`, show the consent text identified by `profile_consent_version`, (2) when online `PUT` the
    profile with `consent.accepted=true` and `consent.version=<that value>` (the server answers 422 on a missing/false/stale consent and stores nothing),
    (3) remember the returned `profile_version` and send it as `If-Match` on later edits (409 means another copy won: `GET` it, merge, retry),
    (4) compare `Device.profile_version` (from `GET /devices/{id}`) with the local one after reinstall or on regaining signal; a `404` on
    `GET /devices/{id}/profile` or a lower server version means re-`PUT`. Writes are rate limited per device.
    While offline the SOS envelope carries a small `MeshPayload.profile_summary` (name, age range, coarse flags) so responders still see who is calling; the
    server attaches it to the case until a synced profile exists and drops it when the full profile arrives (linked by the signed sender device id).
    Profiles are personal data: stored with the sensitive part AES-256-GCM encrypted, never logged, deleted with the device, with its last case
    (when the event is purged or the case is erased) or after prolonged inactivity (`PROFILE_RETENTION_DAYS`). Profile changes re-triage the device's open cases
    (vulnerability flags raise the score modestly) and emit a `profile.updated` WebSocket frame carrying public fields only.

    ## Conventions
    - Base URL: `/v1`. JSON only (`application/json`), UTF-8. All timestamps are RFC 3339 UTC.
    - IDs: `sos.id` is a client-generated UUIDv7 (mesh message id, enables idempotent upload). All other ids are server-generated UUIDs.
    - **Idempotency:** uploading an SOS whose `id` already exists returns the existing record (`200`, not `201`) and merges any new `hop_path` info. Gateways may safely retry.
    - **Pagination:** cursor based. `?limit=` (default 50, max 200) and `?cursor=`. Responses are `{ "data": [...], "next_cursor": string|null }`.
    - **Errors:** every non-2xx response is `Error` (`code`, `message`, optional `details`).
    - **Rate limits:** per device key and per IP; `429` with `Retry-After`.

    ## Auth
    | Caller | Mechanism |
    |---|---|
    | Responder dashboard | `Authorization: Bearer <JWT>` from `POST /auth/login`. Short-lived access token + refresh token. |
    | Android app (gateway/direct) | Device registers its public key once (`POST /devices`). Authenticated calls carry `X-Device-Id` and `X-Device-Signature` (base64 ECDSA-P256 signature over `METHOD\nPATH\nSHA256(body)\nX-Timestamp`) plus `X-Timestamp` (reject if skew > 5 min). |
    | Mesh envelope | Independently signed by the original sender (see `MeshEnvelope`); backend verifies regardless of which gateway uploaded it. |

    ## Privacy rules enforced by the server
    - Exact `lat/lng` is returned only to the **assigned responder** (or `admin`). Everyone else gets `approx_location` (~1 km grid cell centre).
    - `sender_hash` is a salted hash of the device key / phone number; raw identifiers are never returned.
    - **Profile (identity) privacy:** the user's `full_name` (plus `preferred_name`, coarse `age_range` and coarse `vulnerability_flags`) is visible to every
      dashboard user (responder, volunteer, admin) on queue cards and case panels (`Sos.profile`). Every other profile field (medical, address, emergency contact,
      phone, appearance, household, notes, exact `birth_year`) is returned only to the device that owns it, to `admin`, and to the responder holding the
      ACTIVE assignment on one of that device's cases (same rule as exact location). See the Profiles section below.
    - Hop limits by priority (clients set `max_hops`/`expires_at`; server validates them against this table):
      | Tier | max_hops | TTL |
      |---|---|---|
      | critical (trapped, injured, medical) | 10 | 24 h |
      | high (water/meds) | 7 | 12 h |
      | normal (check-in reply) | 5 | 6 h |
      | safe | 3 | 3 h |
      | heartbeat (disaster-wide liveness ping) | 2 | 30 min |

    ## WebSocket (live updates)
    Connect to `wss://{host}/v1/ws?token=<JWT>` (responders only). Server pushes JSON frames `{ "event": <name>, "data": <payload>, "ts": <rfc3339> }`.
    Client may send `{ "action": "subscribe", "channels": ["sos","assignments","mesh","deadzones","offers"] }` (default: all) and `{ "action": "ping" }` (server replies `{ "event": "pong" }`). Server sends a ping frame every 30 s.
    Events (payload schemas under `components/schemas/WsEvent*`):
    `sos.created`, `sos.updated` (score/status/dedupe changes), `sos.merged`, `sos.silent` (an open case lost contact or missed its welfare check-in deadline), `checkin.sent`, `checkin.responded`, `assignment.created`, `assignment.updated`, `offer.created`, `offer.matched`, `heartbeat.silent` (a phone that was heartbeating stopped; no case implied), `heartbeat.resumed` (heartbeats are back; payload `connectivity=connected`), `profile.updated` (a device with open cases changed its profile; public fields only), `deadzones.updated`, `mesh.stats`.
    After reconnect, clients should refetch via REST (`GET /sos?updated_since=`) to close gaps; events are not replayed.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/v1
    description: Local dev
  - url: https://api.beacon.example/v1
    description: Deployed

tags:
  - name: Auth
  - name: Devices
  - name: Profiles
    description: Victim identity profile (name + identifying characteristics) synced from the app at install; privacy-tiered, encrypted at rest.
  - name: SOS
  - name: Check-ins
    description: Welfare check-ins asked of people with an open SOS (layer B). Liveness itself is automatic (see Heartbeats).
  - name: Assignments
  - name: Responders
  - name: Offers
  - name: Mesh
  - name: Events
  - name: Heartbeats
  - name: Map
  - name: System

security:
  - responderJwt: []

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      security: []
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status: { type: string, enum: [ok] }
                  time: { type: string, format: date-time }
                  version: { type: string }
                  triage:
                    type: object
                    description: Nemotron triage backend (NVIDIA NIM served from Brev). When unreachable, scoring falls back to rules-only (`Triage.llm_used=false`, lower confidence).
                    properties:
                      status: { type: string, enum: [ok, degraded, down] }
                      model: { type: string, example: nvidia/nemotron }
                      latency_ms: { type: integer }

  /server-info:
    get:
      tags: [System]
      summary: Public config the phone needs offline-first (backend encryption key, hop table, current event)
      description: Phones should fetch and cache this while online (e.g. at onboarding) so they can encrypt payloads for the backend and set hop limits while offline.
      security: []
      operationId: getServerInfo
      responses:
        "200":
          description: Server info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Responder login
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange refresh token for new access token
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current responder
      operationId: getMe
      responses:
        "200":
          description: Current responder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Responder" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Devices
  /devices:
    post:
      tags: [Devices]
      summary: Register a phone's public key
      description: Called once, when online (onboarding or first gateway moment). Idempotent on `public_key`; returns the existing device.
      security: []
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegister" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "200":
          description: Already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Devices]
      summary: List devices (responder/admin)
      operationId: listDevices
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: flagged
          in: query
          description: Only devices flagged for abuse
          schema: { type: boolean }
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Device" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [Devices]
      summary: Get device
      operationId: getDevice
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Devices]
      summary: Update device (push token, display name) or flag/unflag (admin)
      operationId: updateDevice
      security:
        - responderJwt: []
        - deviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Devices]
      summary: Delete device and its personal data (right to erasure)
      operationId: deleteDevice
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Profiles
  /devices/{deviceId}/profile:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    put:
      tags: [Profiles]
      summary: Create or replace the calling device's identity profile (idempotent)
      description: |
        Device signature auth; the calling device must equal `deviceId` (otherwise `403`). Full replace (PUT semantics): fields omitted from the body are
        removed. Sending the same body twice yields the same stored profile (the second call still bumps `profile_version` and `updated_at`).

        - `consent.accepted` must be `true` and `consent.version` must equal `ServerInfo.profile_consent_version`, otherwise `422` and nothing is stored.
        - Optimistic concurrency: send `If-Match: <profile_version>` (bare integer or quoted, as returned in the body and the `ETag` header). A stale value
          answers `409` with `details.profile_version` = the current version. `If-Match: 0` means "only create": `409` if a profile already exists.
          Without `If-Match` the write is unconditional (last write wins).
        - `profile_version` starts at 1 and is incremented by the server on every successful write.
        - Rate limited per device (`429` + `Retry-After`).
        - Changing the profile re-triages the device's open cases and emits `profile.updated` (public fields only).
        - Never put profile content in logs or crash reports on the client either.
      operationId: putProfile
      security:
        - deviceSignature: []
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Expected current `profile_version` (integer, optionally quoted); `0` = must not exist yet.
          schema: { type: string, pattern: '^"?[0-9]{1,9}"?$', example: "3" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
            example:
              full_name: Maria Elena Gonzalez
              preferred_name: Elena
              birth_year: 1951
              languages: [es, en]
              phone: "+19725550142"
              appearance: { height_cm: 160, hair: "short grey", clothing: "blue cardigan", distinguishing_marks: "scar on left wrist" }
              medical: { conditions: [type 2 diabetes, hypertension], medications: [insulin glargine, lisinopril], allergies: [penicillin], blood_type: "O+" }
              mobility: { needs: [walks_with_aid, oxygen_dependent], notes: "uses a cane; portable oxygen concentrator, 6 h battery" }
              household: { people_count: 3, children: 1, elderly: 1, pets: [{ kind: dog, count: 1 }] }
              home_address: "412 Cedar Ln, Richardson, TX 75080"
              emergency_contact: { name: Daniel Gonzalez, phone: "+19725550177", relationship: son }
              notes: "Second floor apartment, key under the green pot."
              consent: { accepted: true, version: "2026-11-v1", accepted_at: "2026-11-07T15:58:00Z" }
      responses:
        "201":
          description: Profile created (`profile_version` = 1)
          headers:
            ETag: { description: "Quoted `profile_version`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }
        "200":
          description: Profile replaced (`profile_version` incremented)
          headers:
            ETag: { description: "Quoted `profile_version`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFull" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Profiles]
      summary: Read a device's profile (view depends on who asks)
      description: |
        The response `view` field tells which shape you got.

        | Caller | Result |
        |---|---|
        | The device itself | `ProfileFull` (`view=full`) |
        | `admin` | `ProfileFull` |
        | Responder who holds an ACTIVE assignment (`assigned`, `en_route`, `on_scene`) on a non-closed case of this device (or of a case merged with it) | `ProfileFull` |
        | Any other responder / volunteer (including a responder whose assignment was released) | `ProfilePublic` (`view=public`): name, preferred name, age range, coarse flags only |
        | Another device | `403` |

        `404` when the device has no profile (a mesh `profile_summary` alone does not count). Response carries `ETag` (full view only).
      operationId: getProfile
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "200":
          description: Profile
          headers:
            ETag: { description: "Quoted `profile_version` (full view only)", schema: { type: string } }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProfileFull"
                  - $ref: "#/components/schemas/ProfilePublic"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Profiles]
      summary: Erase the profile (device itself or admin)
      description: Right to erasure. Also drops any mesh `profile_summary` still attached to the device's cases and re-triages them without profile signals. Other responders get `403`.
      operationId: deleteProfile
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- SOS
  /sos:
    post:
      tags: [SOS]
      summary: Create a single SOS (direct from a connected phone; mesh-relayed messages use `/sos/batch`)
      description: |
        Idempotent on `id`. Server runs rules triage -> Nemotron triage -> dedupe, then broadcasts `sos.created`.
        For mesh-relayed messages use `POST /sos/batch` with envelopes instead.
      operationId: createSos
      security:
        - deviceSignature: []
        - responderJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SosCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "200":
          description: Already existed (idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [SOS]
      summary: List/rank SOS cases (the dashboard queue)
      operationId: listSos
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/SosStatus" }
          style: form
          explode: false
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/Channel" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: min_score
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: silent
          in: query
          description: Only cases flagged silent
          schema: { type: boolean }
        - name: assigned_to
          in: query
          description: Responder id, or `me`, or `none` for unclaimed
          schema: { type: string }
        - name: bbox
          in: query
          description: "min_lng,min_lat,max_lng,max_lat"
          schema: { type: string, examples: ["-97.1,32.9,-96.6,33.1"] }
        - name: updated_since
          in: query
          description: Only records changed after this time (reconnect catch-up)
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema:
            type: string
            enum: [priority, -created_at, -last_heard_at, -score]
            default: priority
          description: "`priority` = score desc, silent first, then oldest unresolved"
        - name: q
          in: query
          description: Free-text search over note text
          schema: { type: string }
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Sos" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sos/batch:
    post:
      tags: [SOS, Mesh]
      summary: Gateway upload of held mesh messages
      description: |
        A phone with signal uploads everything it holds. Each envelope is verified independently (signature, expiry, hop sanity, per-device rate limit).
        Envelopes of `kind=heartbeat` are accepted here too (result `status=created`, no `sos_id`). Per-item results are returned; the call itself is `200` even if some items are rejected. Server then emits `DELIVERED` receipts (see `GET /mesh/receipts`).
      operationId: uploadSosBatch
      security:
        - deviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelopes]
              properties:
                envelopes:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/MeshEnvelope" }
      responses:
        "200":
          description: Per-item results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, status]
                      properties:
                        id: { type: string, format: uuid }
                        status:
                          type: string
                          enum: [created, duplicate, rejected]
                        reason:
                          type: string
                          enum: [bad_signature, expired, hop_limit_exceeded, invalid_limits, rate_limited, undecryptable, malformed]
                        sos_id: { type: string, format: uuid }
                  receipts:
                    type: array
                    description: Receipts the gateway should relay back into the mesh
                    items: { $ref: "#/components/schemas/DeliveredReceipt" }
                  messages:
                    type: array
                    description: Other pending backend-to-phone messages (same as `/mesh/outbox`)
                    items: { $ref: "#/components/schemas/BackendMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /sos/{sosId}:
    parameters:
      - $ref: "#/components/parameters/SosId"
    get:
      tags: [SOS]
      summary: Get one case with triage reasoning, hop trail, check-ins and assignment
      operationId: getSos
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SosDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [SOS]
      summary: Update case (responder edits, manual score override, status change, add note)
      operationId: updateSos
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SosUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [SOS]
      summary: Delete case and its personal data (admin)
      operationId: deleteSos
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sos/{sosId}/retriage:
    parameters:
      - $ref: "#/components/parameters/SosId"
    post:
      tags: [SOS]
      summary: Re-run rules + Nemotron triage
      operationId: retriageSos
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sos/{sosId}/events:
    get:
      tags: [SOS]
      summary: Status/audit trail for the case
      operationId: listSosEvents
      parameters:
        - $ref: "#/components/parameters/SosId"
      responses:
        "200":
          description: Chronological events
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SosEvent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sos/{sosId}/merge:
    post:
      tags: [SOS]
      summary: Manually merge duplicate cases into this one
      operationId: mergeSos
      parameters:
        - $ref: "#/components/parameters/SosId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicate_ids]
              properties:
                duplicate_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Merged primary case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sos/{sosId}/unmerge:
    post:
      tags: [SOS]
      summary: Split a wrongly merged report back out
      operationId: unmergeSos
      parameters:
        - $ref: "#/components/parameters/SosId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_id]
              properties:
                report_id: { type: string, format: uuid }
      responses:
        "200":
          description: Primary case after split
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sos/{sosId}/status:
    get:
      tags: [SOS]
      summary: Victim-facing status of own SOS (app polls this when online)
      description: Returns only what a victim may see (no exact location of others, no internal reasoning). Caller must be the sender device.
      operationId: getSosPublicStatus
      parameters:
        - $ref: "#/components/parameters/SosId"
      security:
        - deviceSignature: []
      responses:
        "200":
          description: Public status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SosPublicStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sos/{sosId}/voice-note:
    parameters:
      - $ref: "#/components/parameters/SosId"
    put:
      tags: [SOS]
      summary: Upload the voice note for a case (gateway or direct, after the SOS itself arrived)
      description: |
        Voice notes are too large for the mesh, so the SOS travels first with `has_voice_note=true` (and the local `voice_note_ref`),
        and the audio is uploaded here once the phone has signal. Max 2 MB, `audio/ogg` (Opus), `audio/mp4` or `audio/webm`, up to 60 s.
        Idempotent: re-uploading replaces the file. Transcription (if enabled) is attached to the case as a note.
      operationId: uploadVoiceNote
      security:
        - deviceSignature: []
      requestBody:
        required: true
        content:
          audio/ogg: { schema: { type: string, format: binary } }
          audio/mp4: { schema: { type: string, format: binary } }
          audio/webm: { schema: { type: string, format: binary } }
      responses:
        "204": { description: Stored }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: File too large, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "Unsupported audio type (only audio/ogg, audio/mp4, audio/webm)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [SOS]
      summary: Download the voice note (assigned responder or admin)
      operationId: getVoiceNote
      responses:
        "200":
          description: Audio
          content:
            audio/ogg: { schema: { type: string, format: binary } }
            audio/mp4: { schema: { type: string, format: binary } }
            audio/webm: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [SOS]
      summary: Delete the voice note
      operationId: deleteVoiceNote
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Check-ins
  /sos/{sosId}/checkins:
    parameters:
      - $ref: "#/components/parameters/SosId"
    get:
      tags: [Check-ins]
      summary: List check-ins for a case
      operationId: listCheckins
      responses:
        "200":
          description: Check-ins
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Checkin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Check-ins]
      summary: Send a welfare check-in now (responder-triggered; the server also creates them automatically on the tier interval)
      description: Creates a normal welfare check-in (same `choices`, `deadline_at`, `alarm_at`, notification delivery) outside the schedule.
      operationId: createCheckin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  $ref: "#/components/schemas/Channel"
                message: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Check-in sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /checkins/pending:
    get:
      tags: [Check-ins]
      summary: Welfare check-ins awaiting an answer for the calling device (app fetches when online)
      description: Unanswered, not-yet-missed check-ins of the device's open cases, earliest deadline first. The same objects also arrive as `pending_checkins` in the `POST /heartbeats` response, so a heartbeating app rarely needs to poll this.
      operationId: listPendingCheckins
      security:
        - deviceSignature: []
      responses:
        "200":
          description: Pending check-ins
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Checkin" }
  /checkins/{checkinId}:
    parameters:
      - $ref: "#/components/parameters/CheckinId"
    get:
      tags: [Check-ins]
      summary: Get check-in
      operationId: getCheckin
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "200":
          description: Check-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Check-ins]
      summary: Answer a welfare check-in
      description: |
        `still_here` confirms (timer restarts, no score change). `no_longer_need_help` resolves the case (assignment `outcome=self_resolved`, `status_update` back to the phone).
        `need_urgent_help` adds +15 score (cap +30). Every answer ends silence (`contact_restored`) and counts as a heartbeat; scores are never lowered.
        A late answer after `deadline_at` is still accepted. Legacy `ok` = `still_here`, `need_help` = `need_urgent_help`, `other` = `still_here` with free text.
        Mesh-relayed answers arrive as normal-tier envelopes via `/sos/batch` with `kind=checkin_reply` (`checkin_id` + `response` + optional `text`).
      operationId: respondCheckin
      security:
        - deviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  $ref: "#/components/schemas/CheckinResponse"
                text: { type: string, maxLength: 1000 }
                responded_at: { type: string, format: date-time, description: "Client time; defaults to server time" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Check-ins]
      summary: Cancel a pending check-in
      operationId: deleteCheckin
      responses:
        "204": { description: Cancelled }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Assignments
  /assignments:
    post:
      tags: [Assignments]
      summary: Claim a case
      description: One active assignment per case; a second claim returns `409` with the current assignee. `responder_id` defaults to the caller; only admin may assign others.
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentCreate" }
      responses:
        "201":
          description: Claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Assignments]
      summary: List assignments
      operationId: listAssignments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: responder_id
          in: query
          description: Responder id or `me`
          schema: { type: string }
        - name: sos_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/AssignmentStatus" }
          style: form
          explode: false
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Assignment" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /assignments/{assignmentId}:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    get:
      tags: [Assignments]
      summary: Get assignment (includes exact location for the assignee)
      operationId: getAssignment
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Assignments]
      summary: Advance status (assigned -> en_route -> on_scene -> resolved), set ETA, or reassign
      description: |
        Valid transitions: `assigned→en_route→on_scene→resolved`, any→`released` (case returns to queue), any→`cancelled`.
        Status changes are pushed to the victim via the channel they used ("Help is on the way, ETA 40 min").
      operationId: updateAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Assignments]
      summary: Release a claim (equivalent to status=released)
      operationId: deleteAssignment
      responses:
        "204": { description: Released }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Responders
  /responders:
    get:
      tags: [Responders]
      summary: List responders
      operationId: listResponders
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: skill
          in: query
          schema: { type: string }
        - name: available
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Responders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Responder" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Responders]
      summary: Create a responder (admin)
      operationId: createResponder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponderCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Responder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /responders/{responderId}:
    parameters:
      - $ref: "#/components/parameters/ResponderId"
    get:
      tags: [Responders]
      summary: Get responder
      operationId: getResponder
      responses:
        "200":
          description: Responder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Responder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Responders]
      summary: "Update responder (self: availability/location/skills; admin: anything)"
      operationId: updateResponder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponderUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Responder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Responders]
      summary: Deactivate responder (admin)
      operationId: deleteResponder
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Offers (neighbor assist)
  /offers:
    post:
      tags: [Offers]
      summary: Offer help (user marked Safe offers a boat, water, etc.)
      operationId: createOffer
      security:
        - deviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferCreate" }
      responses:
        "201":
          description: Created; server immediately computes nearby matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Offers]
      summary: List offers
      operationId: listOffers
      security:
        - responderJwt: []
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/OfferKind" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OfferStatus" }
        - name: near
          in: query
          description: "lat,lng — only offers within `radius_km`"
          schema: { type: string }
        - name: radius_km
          in: query
          schema: { type: number, default: 5 }
        - name: mine
          in: query
          description: Only the calling device's offers
          schema: { type: boolean }
      responses:
        "200":
          description: Offers (responders see exact location only if matched to their case; others see approx)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Offer" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offerId}:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    get:
      tags: [Offers]
      summary: Get offer
      operationId: getOffer
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "200":
          description: Offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Offers]
      summary: Edit/withdraw offer
      operationId: updateOffer
      security:
        - responderJwt: []
        - deviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Offers]
      summary: Delete offer
      operationId: deleteOffer
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offerId}/matches:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    get:
      tags: [Offers]
      summary: SOS cases this offer is matched to
      operationId: listOfferMatches
      security:
        - responderJwt: []
        - deviceSignature: []
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OfferMatch" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Offers]
      summary: Manually match this offer to a case (responder)
      operationId: createOfferMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sos_id]
              properties:
                sos_id: { type: string, format: uuid }
      responses:
        "201":
          description: Match created; offerer is notified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferMatch" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /offers/{offerId}/matches/{matchId}:
    parameters:
      - $ref: "#/components/parameters/OfferId"
      - name: matchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Offers]
      summary: Accept/decline/complete a match (offerer or responder)
      operationId: updateOfferMatch
      security:
        - responderJwt: []
        - deviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, declined, completed]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferMatch" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Offers]
      summary: Remove a match
      operationId: deleteOfferMatch
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Mesh
  /mesh/stats:
    get:
      tags: [Mesh]
      summary: Mesh health panel
      operationId: getMeshStats
      parameters:
        - name: window_minutes
          in: query
          schema: { type: integer, default: 60, minimum: 1, maximum: 1440 }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeshStats" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesh/receipts:
    get:
      tags: [Mesh]
      summary: DELIVERED receipts to inject back into the mesh
      description: Gateways pull recent receipts and broadcast them (5-hop limit). Phones holding a copy of a delivered id delete it and stop relaying; the original sender shows "Your SOS reached responders ✓".
      operationId: listReceipts
      security:
        - deviceSignature: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Receipts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DeliveredReceipt" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesh/simulate:
    post:
      tags: [Mesh]
      summary: Demo "simulate relay" mode — inject a synthetic SOS with a fabricated hop path
      description: Disabled unless server runs with `DEMO_MODE=true` (otherwise `404`). Created cases have `synthetic=true`.
      operationId: simulateRelay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, category]
              properties:
                lat: { type: number }
                lng: { type: number }
                category: { $ref: "#/components/schemas/Category" }
                text: { type: string }
                people_count: { type: integer }
                hops: { type: integer, minimum: 0, maximum: 10, default: 3 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesh/seed:
    post:
      tags: [Mesh]
      summary: Generate synthetic disaster data (demo)
      description: Demo mode only. Creates N synthetic cases clustered around a centre point.
      operationId: seedSyntheticData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [center_lat, center_lng]
              properties:
                center_lat: { type: number }
                center_lng: { type: number }
                radius_km: { type: number, default: 5 }
                count: { type: integer, default: 40, maximum: 500 }
      responses:
        "201":
          description: Seeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Mesh]
      summary: Delete all synthetic data
      operationId: clearSyntheticData
      responses:
        "204": { description: Cleared }
        "403": { $ref: "#/components/responses/Forbidden" }

  /heartbeats:
    post:
      tags: [Heartbeats]
      summary: Send a heartbeat directly (phone is online)
      description: |
        Sent AUTOMATICALLY by the app every `heartbeat_interval_seconds`; no user action. Receiving it is the check-in. Mesh-relayed heartbeats arrive via `POST /sos/batch` instead.
        `sent_at` is the phone's own time; the server also records `received_at`. Accepted when an event is active OR the device has an open SOS (attached to the case's event);
        `404` only when neither applies. The 202 body returns the device's `pending_checkins` (welfare check-ins to show as notifications right away).
      operationId: sendHeartbeat
      security:
        - deviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeartbeatCreate" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_heartbeat_in_seconds: { type: integer }
                  event_active: { type: boolean, description: "False when accepted only because the device has an open SOS" }
                  pending_checkins:
                    type: array
                    description: Welfare check-ins awaiting an answer (same as GET /checkins/pending)
                    items: { $ref: "#/components/schemas/Checkin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Heartbeats]
      summary: List heartbeats (history; coarse locations only)
      operationId: listHeartbeats
      security:
        - responderJwt: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Heartbeats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Heartbeat" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /heartbeats/silent:
    get:
      tags: [Heartbeats]
      summary: Devices that stopped heartbeating (lost contact; quiet or distress)
      description: Information list for the dashboard. `quiet` = missed the threshold, probably no connectivity. `distress` = missed it while neighbours still report, or the device has an open SOS. Listing a device here never creates a case.
      operationId: listSilentDevices
      security:
        - responderJwt: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: array
            items: { type: string, enum: [quiet, distress] }
          style: form
          explode: false
        - name: bbox
          in: query
          schema: { type: string }
        - name: include_acknowledged
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Silent devices, most urgent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SilentDevice" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /heartbeats/silent/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [Heartbeats]
      summary: One silent device
      operationId: getSilentDevice
      responses:
        "200":
          description: Silent device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SilentDevice" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Heartbeats]
      summary: Acknowledge or dismiss a silent-device flag (e.g. contacted, false alarm)
      operationId: updateSilentDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledged: { type: boolean }
                note: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SilentDevice" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /heartbeats/silent/{deviceId}/promote:
    post:
      tags: [Heartbeats]
      summary: Turn a silent device into an SOS case so it enters the ranked queue and can be claimed
      operationId: promoteSilentDevice
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "201":
          description: Case created (category `other`, `silent=true`, location = last known cell)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sos" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesh/outbox:
    get:
      tags: [Mesh]
      summary: Backend-to-phone messages for a gateway to inject into the mesh (receipts, check-in requests, status updates)
      description: |
        A gateway calls this whenever online and broadcasts the returned `BackendMessage`s to peers (each has its own `max_hops`/`expires_at`).
        Every phone checks `target_sender_hash` / `sos_id` against what it holds; the addressed phone shows it, others just relay and forget.
        Supersedes `/mesh/receipts`, which stays as a receipts-only shortcut.
      operationId: getMeshOutbox
      security:
        - deviceSignature: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BackendMessage" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /events:
    get:
      tags: [Events]
      summary: List disaster events
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { type: string, enum: [active, closed, purged] }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Event" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Events]
      summary: Open a disaster event (admin). New SOS cases attach to the single active event.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Get event with case counts
      operationId: getEvent
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Events]
      summary: Edit event (name, region, retention) (admin)
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Events]
      summary: Delete event and all its data immediately (admin)
      operationId: deleteEvent
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /events/{eventId}/close:
    post:
      tags: [Events]
      summary: Close the event (admin). Stops silence detection and welfare check-ins; starts the retention countdown.
      description: Personal data (exact locations, text, voice notes, device links) is purged automatically after `retention_days`, or immediately via `/purge`. Aggregate stats are kept.
      operationId: closeEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /events/{eventId}/purge:
    post:
      tags: [Events]
      summary: Purge personal data now (admin, closed events only)
      description: Nulls location/text/voice/device links of the event's cases (see design doc) and deletes the identity profiles (and mesh `profile_summary` hints) of devices that have no case left anywhere.
      operationId: purgeEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Purge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged_cases: { type: integer }
                  purged_voice_notes: { type: integer }
                  purged_profiles: { type: integer, description: "Identity profiles deleted because their device has no case left (see Profiles lifecycle)" }
                  purged_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  # ---------------------------------------------------------------- Map
  /map/heat:
    get:
      tags: [Map]
      summary: Heat layer cells (coarse, privacy-safe)
      description: Counts active cases only (reported, assigned, en_route, on_scene); resolved, closed and merged duplicates contribute nothing.
      operationId: getHeat
      parameters:
        - name: bbox
          in: query
          required: true
          schema: { type: string, description: "min_lng,min_lat,max_lng,max_lat" }
        - name: cell_km
          in: query
          schema: { type: number, default: 1 }
      responses:
        "200":
          description: Cells
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [lat, lng, count, max_score]
                      properties:
                        lat: { type: number }
                        lng: { type: number }
                        count: { type: integer }
                        max_score: { type: integer }
        "422": { $ref: "#/components/responses/ValidationError" }
  /map/deadzones:
    get:
      tags: [Map]
      summary: Dead zones — areas with no check-ins/reports where people may be overlooked
      operationId: listDeadzones
      parameters:
        - name: bbox
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Dead zones
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Deadzone" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /map/deadzones/{deadzoneId}:
    parameters:
      - name: deadzoneId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Map]
      summary: Mark a dead zone as being checked / dismissed (responder)
      operationId: updateDeadzone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, being_checked, dismissed] }
                note: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deadzone" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    responderJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Responder or admin access token from `/auth/login`.
    deviceSignature:
      type: apiKey
      in: header
      name: X-Device-Signature
      description: Also requires `X-Device-Id` and `X-Timestamp`. See API description.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    SosId:
      name: sosId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CheckinId:
      name: checkinId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResponderId:
      name: responderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing/invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict (e.g. case already claimed; `details.assignment` holds current assignment)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, not_found, conflict, validation_failed, rate_limited, bad_signature, expired, internal]
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          description: "For validation errors, `{ \"fields\": { \"<path>\": \"<msg>\" } }`"
      example:
        code: conflict
        message: Case already claimed by another responder
        details: { assignment_id: "0b0c3b0e-0000-7000-8000-000000000001" }

    Page:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: {} }
        next_cursor: { type: [string, "null"] }

    # ---- enums
    Channel:
      type: string
      enum: [mesh, app]
      description: "`mesh` = arrived via phone-to-phone relay and uploaded by a gateway; `app` = sent directly by the phone while online."
    Category:
      type: string
      enum: [injured, trapped, need_water_meds, safe, other]
    Tier:
      type: string
      enum: [critical, high, normal, safe, heartbeat]
    SosStatus:
      type: string
      enum: [reported, assigned, en_route, on_scene, resolved, merged, closed]
      description: "`merged` = absorbed into another case (see `merged_into`)."
    AssignmentStatus:
      type: string
      enum: [assigned, en_route, on_scene, resolved, released, cancelled]
    Confidence:
      type: string
      enum: [low, medium, high]
    OfferKind:
      type: string
      enum: [boat, water, food, medical, shelter, transport, other]
    OfferStatus:
      type: string
      enum: [open, matched, completed, withdrawn]
    Role:
      type: string
      enum: [responder, volunteer, admin]

    # ---- shared
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    ApproxLocation:
      type: object
      description: Centre of a ~1 km grid cell
      required: [lat, lng, radius_m]
      properties:
        lat: { type: number }
        lng: { type: number }
        radius_m: { type: integer, example: 1000 }

    ServerInfo:
      type: object
      required: [server_time, encryption_public_key, hop_limits]
      properties:
        server_time: { type: string, format: date-time }
        event:
          oneOf:
            - $ref: "#/components/schemas/Event"
            - type: "null"
          description: Current active event, if any
        encryption_public_key:
          type: string
          description: Base64 X.509 SubjectPublicKeyInfo DER of the backend's P-256 (secp256r1) ECDH public key. Phones encrypt `payload` to it with the ECIES scheme in server/docs/crypto.md (ephemeral ECDH + HKDF-SHA256 + AES-256-GCM); this is a plain SPKI key, not a Tink keyset.
        signing_public_key:
          type: string
          description: Base64 X.509 SPKI DER of the backend's ECDSA P-256 signing key. Phones verify DELIVERED receipts and `BackendMessage` signatures with it (see server/docs/crypto.md).
        hop_limits:
          type: array
          items:
            type: object
            required: [tier, max_hops, ttl_seconds]
            properties:
              tier: { $ref: "#/components/schemas/Tier" }
              max_hops: { type: integer }
              ttl_seconds: { type: integer }
        checkin_interval_seconds: { type: integer, example: 1800, description: "Welfare check-in interval of `normal` tier cases (see `checkin_intervals_seconds`)" }
        checkin_intervals_seconds:
          type: object
          description: Welfare check-in interval per case tier (measured from the last answer). `safe` cases get none.
          properties:
            critical: { type: integer, example: 600 }
            high: { type: integer, example: 900 }
            normal: { type: integer, example: 1800 }
        checkin_window_seconds: { type: integer, example: 300, description: "Time to answer a check-in: deadline_at = sent_at + this" }
        checkin_alarm_lead_seconds: { type: integer, example: 60, description: "alarm_at = deadline_at - this; the app sounds its final-try alarm then" }
        heartbeat_interval_seconds: { type: integer, example: 300, description: "Every installed app sends an automatic heartbeat this often (always present, also without an active event; keep sending while an SOS is open)" }
        silence_threshold_seconds: { type: integer, example: 1200, description: "No contact for this long = lost contact (device probably has no connectivity); with an open SOS the case becomes silent" }
        gateway_upload_max_batch: { type: integer, example: 500 }
        profile_required:
          type: boolean
          example: true
          description: Onboarding must collect at least `full_name` + consent and `PUT /devices/{id}/profile` it (the user may skip explicitly; SOS is never blocked by a missing profile).
        profile_consent_version:
          type: string
          example: "2026-11-v1"
          description: Version id of the profile consent text the app must show; echo it in `ProfileInput.consent.version`. A change means users must re-consent.

    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in, responder]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds, example: 900 }
        responder: { $ref: "#/components/schemas/Responder" }

    # ---- devices
    DeviceRegister:
      type: object
      required: [public_key, platform]
      properties:
        public_key: { type: string, description: Base64 X.509 ECDSA P-256 public key from Android Keystore }
        platform: { type: string, enum: [android, ios] }
        app_version: { type: string }
        push_token: { type: string }
        display_name: { type: string, maxLength: 60 }
        attestation: { type: string, description: Optional Play Integrity / key attestation token }
    DeviceUpdate:
      type: object
      properties:
        push_token: { type: string }
        display_name: { type: string, maxLength: 60 }
        flagged: { type: boolean, description: Admin only }
        flag_reason: { type: string, description: Admin only }
    Device:
      type: object
      required: [id, sender_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        sender_hash: { type: string }
        platform: { type: string }
        app_version: { type: string }
        display_name: { type: [string, "null"] }
        flagged: { type: boolean }
        flag_reason: { type: [string, "null"] }
        sos_count: { type: integer }
        heartbeat_status: { $ref: "#/components/schemas/HeartbeatStatus" }
        last_heartbeat_at: { type: [string, "null"], format: date-time, description: Last automatic heartbeat (or legacy check-in reply) from this device }
        connectivity: { $ref: "#/components/schemas/Connectivity" }
        last_transport: { type: [string, "null"], enum: [direct, mesh, null], description: How the last heartbeat arrived }
        last_network: { type: [string, "null"], enum: [wifi, cellular, none, unknown, null] }
        last_battery_pct: { type: [integer, "null"] }
        last_peers_nearby: { type: [integer, "null"] }
        last_gateway: { type: [boolean, "null"], description: Phone had internet and was relaying others at its last heartbeat }
        last_seen_at: { type: [string, "null"], format: date-time }
        profile_version: { type: [integer, "null"], description: "Server copy's `profile_version`, null when the server holds no profile for this device" }
        created_at: { type: string, format: date-time }

    # ---- profiles
    AgeRange:
      type: string
      enum: ["0-12", "13-17", "18-34", "35-49", "50-64", "65-79", "80+"]
      description: Coarse age bucket derived server-side from `birth_year` (current year minus birth year; may be off by one).
    VulnerabilityFlag:
      type: string
      enum: [mobility, medical, elderly, child, oxygen, sensory, cognitive]
      description: |
        Coarse flags derived server-side, safe to show to every dashboard user. `mobility` = needs wheelchair / cannot_walk / walks_with_aid;
        `medical` = any listed condition, medication or allergy; `oxygen` = oxygen_dependent; `sensory` = vision_impaired / hearing_impaired;
        `cognitive` = cognitive need; `elderly` = age 65+; `child` = age 12 or younger.
    ProfileConsent:
      type: object
      required: [accepted, version, accepted_at]
      properties:
        accepted: { type: boolean, description: "Must be `true`; otherwise the server answers 422 and stores nothing." }
        version: { type: string, minLength: 1, maxLength: 40, example: "2026-11-v1", description: "Consent text version shown to the user; must equal `ServerInfo.profile_consent_version`." }
        accepted_at: { type: string, format: date-time }
    ProfileAppearance:
      type: object
      description: Free text helps responders recognise the person on scene.
      properties:
        height_cm: { type: integer, minimum: 30, maximum: 260 }
        hair: { type: string, maxLength: 300 }
        clothing: { type: string, maxLength: 300 }
        distinguishing_marks: { type: string, maxLength: 300 }
    ProfileMedical:
      type: object
      properties:
        conditions: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 100 } }
        medications: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 100 } }
        allergies: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 100 } }
        blood_type: { type: string, enum: [A+, A-, B+, B-, AB+, AB-, O+, O-, unknown] }
    ProfileMobility:
      type: object
      properties:
        needs:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, enum: [wheelchair, cannot_walk, walks_with_aid, vision_impaired, hearing_impaired, cognitive, oxygen_dependent, other] }
        notes: { type: string, maxLength: 300 }
    ProfileHousehold:
      type: object
      properties:
        people_count: { type: integer, minimum: 1, maximum: 50, description: People living in the home including the user }
        children: { type: integer, minimum: 0, maximum: 50 }
        elderly: { type: integer, minimum: 0, maximum: 50 }
        pets:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, minLength: 1, maxLength: 40, example: dog }
              count: { type: integer, minimum: 1, maximum: 99 }
    ProfileEmergencyContact:
      type: object
      required: [name, phone, relationship]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, pattern: '^\+?[0-9][0-9 ()\-.]{4,24}[0-9]$', maxLength: 32, description: "E.164-ish: optional +, digits, spaces, dashes, dots, parentheses" }
        relationship: { type: string, minLength: 1, maxLength: 60 }
    ProfileInput:
      type: object
      description: |
        What the phone sends. Only `full_name` and `consent` are required. Full replace on every `PUT`.
        Sensitive fields (everything except `full_name`, `preferred_name`, `birth_year`, `consent`) are encrypted at rest; `full_name` and
        `birth_year` stay queryable in clear text columns by design (name display and age buckets).
      required: [full_name, consent]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120, description: "Visible to every dashboard user." }
        preferred_name: { type: string, minLength: 1, maxLength: 60 }
        birth_year: { type: integer, minimum: 1900, maximum: 2100, description: "Server also rejects years after the current year (422)." }
        languages: { type: array, maxItems: 8, items: { type: string, minLength: 2, maxLength: 35 }, description: "BCP-47 tags (`es`, `en-US`) or plain names (`Spanish`)" }
        phone: { type: string, pattern: '^\+?[0-9][0-9 ()\-.]{4,24}[0-9]$', maxLength: 32 }
        appearance: { $ref: "#/components/schemas/ProfileAppearance" }
        medical: { $ref: "#/components/schemas/ProfileMedical" }
        mobility: { $ref: "#/components/schemas/ProfileMobility" }
        household: { $ref: "#/components/schemas/ProfileHousehold" }
        home_address: { type: string, maxLength: 300 }
        emergency_contact: { $ref: "#/components/schemas/ProfileEmergencyContact" }
        notes: { type: string, maxLength: 1000 }
        consent: { $ref: "#/components/schemas/ProfileConsent" }
    Profile:
      description: The stored profile = the input plus server fields.
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [device_id, profile_version, created_at, updated_at]
          properties:
            device_id: { type: string, format: uuid }
            profile_version: { type: integer, minimum: 1, description: "Incremented by the server on every write; use as `If-Match`." }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ProfileFull:
      description: Everything stored plus derived fields. Returned only to the owning device, admins and the ACTIVE assignee.
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [view, vulnerability_flags]
          properties:
            view: { type: string, enum: [full] }
            age_range: { $ref: "#/components/schemas/AgeRange" }
            vulnerability_flags:
              type: array
              items: { $ref: "#/components/schemas/VulnerabilityFlag" }
            synthetic: { type: boolean, description: "Demo data generated by /mesh/seed" }
      example:
        view: full
        device_id: 0192a000-0000-7000-8000-0000000000d1
        profile_version: 3
        full_name: Maria Elena Gonzalez
        preferred_name: Elena
        birth_year: 1951
        age_range: "65-79"
        vulnerability_flags: [elderly, medical, mobility, oxygen]
        languages: [es, en]
        phone: "+19725550142"
        medical: { conditions: [type 2 diabetes], medications: [insulin glargine], allergies: [penicillin], blood_type: "O+" }
        mobility: { needs: [walks_with_aid, oxygen_dependent], notes: "portable oxygen concentrator" }
        emergency_contact: { name: Daniel Gonzalez, phone: "+19725550177", relationship: son }
        consent: { accepted: true, version: "2026-11-v1", accepted_at: "2026-11-07T15:58:00Z" }
        created_at: "2026-11-07T15:58:00Z"
        updated_at: "2026-11-07T16:30:00Z"
    ProfilePublic:
      description: |
        The only profile view non-assigned dashboard users get. `Sos.profile` uses it for every case. Contains no sensitive field:
        coarse flags and the age bucket instead of birth year, conditions or mobility details.
      type: object
      required: [view, full_name, has_profile, vulnerability_flags]
      properties:
        view: { type: string, enum: [public] }
        full_name: { type: string }
        preferred_name: { type: string }
        age_range: { $ref: "#/components/schemas/AgeRange" }
        vulnerability_flags:
          type: array
          items: { $ref: "#/components/schemas/VulnerabilityFlag" }
        has_profile: { type: boolean, description: "`true` when a synced server profile exists; `false` when the data comes only from a mesh `profile_summary`." }
        source: { type: string, enum: [synced, mesh_summary], description: "Where the data came from" }
        profile_version: { type: integer, description: "Server profile version (synced) or the phone's version (mesh_summary)" }
      example:
        view: public
        full_name: Maria Elena Gonzalez
        preferred_name: Elena
        age_range: "65-79"
        vulnerability_flags: [elderly, medical, mobility, oxygen]
        has_profile: true
        source: synced
        profile_version: 3
    ProfileSummary:
      type: object
      description: |
        Tiny identity hint inside the encrypted `MeshPayload` of an SOS created offline (keeps envelopes small: well under 400 bytes of JSON).
        The full profile syncs separately once online. The phone derives `age_range` and flags with the same rules as `VulnerabilityFlag` / `AgeRange`.
        Ignored (not an error) if invalid or if a synced profile already exists for the sender device.
      required: [full_name, profile_version]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        age_range: { $ref: "#/components/schemas/AgeRange" }
        vulnerability_flags: { type: array, maxItems: 8, uniqueItems: true, items: { $ref: "#/components/schemas/VulnerabilityFlag" } }
        profile_version: { type: integer, minimum: 0, description: "`profile_version` last acknowledged by the server for this device; 0 if never synced" }
      example: { full_name: Maria Elena Gonzalez, age_range: "65-79", vulnerability_flags: [elderly, oxygen], profile_version: 0 }

    # ---- mesh envelope
    MeshEnvelope:
      type: object
      description: |
        Wire format carried hand to hand and uploaded by gateways. `signature` covers the canonical JSON of
        `{id, sender_key_id, kind, tier, max_hops, expires_at, created_at, routing, payload}` (everything except `hop_count`/`hop_path`,
        which relays mutate). `payload` is encrypted to the backend key, so relays cannot read it.
      required: [id, sender_key_id, kind, tier, max_hops, hop_count, expires_at, created_at, routing, payload, signature]
      properties:
        id: { type: string, format: uuid, description: UUIDv7 }
        sender_key_id: { type: string, description: "Device id, or base64 public key if not yet registered" }
        sender_public_key: { type: string, description: Include if device not yet registered }
        kind:
          type: string
          enum: [sos, checkin_reply, safe, offer, heartbeat]
        tier: { $ref: "#/components/schemas/Tier" }
        max_hops: { type: integer, minimum: 1, maximum: 10 }
        hop_count: { type: integer, minimum: 0, maximum: 10 }
        hop_path:
          type: array
          items: { type: string, example: A1 }
          description: Anonymized relay ids appended by each relay (unsigned)
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        routing:
          type: object
          required: [approx]
          description: Readable by relays
          properties:
            approx: { $ref: "#/components/schemas/ApproxLocation" }
            category: { $ref: "#/components/schemas/Category" }
        payload:
          type: string
          description: Base64 ciphertext of `MeshPayload` JSON
        signature: { type: string, description: Base64 ECDSA signature }
      example:
        id: 0192a7d4-1c2e-7000-8a00-0000000000a1
        sender_key_id: 0192a000-0000-7000-8000-0000000000d1
        kind: sos
        tier: critical
        max_hops: 10
        hop_count: 3
        hop_path: [A1, B7, C3]
        expires_at: "2026-11-08T16:12:00Z"
        created_at: "2026-11-07T16:12:00Z"
        routing: { approx: { lat: 32.99, lng: -96.75, radius_m: 1000 }, category: trapped }
        payload: BASE64_CIPHERTEXT
        signature: MEUCIQDexample
    MeshPayload:
      type: object
      description: Plaintext inside `MeshEnvelope.payload` (documented for client/server implementers)
      required: [lat, lng, category]
      properties:
        lat: { type: number }
        lng: { type: number }
        accuracy_m: { type: number }
        category: { $ref: "#/components/schemas/Category" }
        text: { type: string, maxLength: 1000 }
        voice_note_ref: { type: [string, "null"], description: Reserved; voice notes uploaded via gateway later }
        people_count: { type: integer, minimum: 1 }
        trapped: { type: boolean }
        water_rising: { type: boolean }
        injured: { type: boolean }
        checkin_id: { type: string, format: uuid, description: For kind=checkin_reply }
        response: { $ref: "#/components/schemas/CheckinResponse", description: "For kind=checkin_reply (default still_here)" }
        heartbeat: { $ref: "#/components/schemas/HeartbeatCreate", description: For kind=heartbeat }
        offer: { $ref: "#/components/schemas/OfferCreate", description: For kind=offer }
        profile_summary: { $ref: "#/components/schemas/ProfileSummary", description: "Optional identity hint for kind=sos/safe (see `ProfileSummary`)" }
    DeliveredReceipt:
      type: object
      required: [id, delivered_at, max_hops, signature]
      properties:
        id: { type: string, format: uuid, description: The SOS/envelope id that was delivered }
        delivered_at: { type: string, format: date-time }
        max_hops: { type: integer, const: 5 }
        hop_count: { type: integer, default: 0 }
        signature: { type: string, description: Backend signature so phones can trust it }

    # ---- SOS
    TriageReason:
      type: object
      required: [source, text]
      properties:
        source: { type: string, enum: [rule, llm, silence, heartbeat, checkin, manual], description: "`silence` = lost contact or unanswered welfare check-ins; `checkin` = the person asked for urgent help" }
        text: { type: string, example: 2 people trapped with rising water }
        weight: { type: integer, description: Score contribution }
    Triage:
      type: object
      required: [score, confidence, reasons]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        confidence: { $ref: "#/components/schemas/Confidence" }
        summary: { type: string, example: "Critical: 2 people trapped, mentions oxygen tank. Confidence: high." }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/TriageReason" }
        extracted:
          type: object
          description: Entities the LLM pulled from free text
          properties:
            vulnerable: { type: array, items: { type: string, example: elderly } }
            medical: { type: array, items: { type: string, example: insulin } }
            hazards: { type: array, items: { type: string, example: rising water } }
        tier: { $ref: "#/components/schemas/Tier" }
        llm_used: { type: boolean, description: False if the Nemotron endpoint was unavailable and only rules scored the case }
        model: { type: [string, "null"], description: Model id that produced the extraction }
        scored_at: { type: string, format: date-time }
    HopInfo:
      type: object
      properties:
        hop_count: { type: integer }
        max_hops: { type: integer }
        hop_path:
          type: array
          items: { type: string }
        gateway_device_id: { type: [string, "null"], format: uuid }
        original_created_at: { type: string, format: date-time }
    SosCreate:
      type: object
      required: [id, channel, category]
      properties:
        id: { type: string, format: uuid, description: Client-generated UUIDv7 (idempotency key) }
        channel: { $ref: "#/components/schemas/Channel" }
        category: { $ref: "#/components/schemas/Category" }
        lat: { type: number }
        lng: { type: number }
        accuracy_m: { type: number }
        text: { type: string, maxLength: 1000 }
        people_count: { type: integer, minimum: 1 }
        trapped: { type: boolean }
        water_rising: { type: boolean }
        injured: { type: boolean }
        has_voice_note: { type: boolean, description: "Audio will follow via PUT /sos/{id}/voice-note" }
        created_at: { type: string, format: date-time, description: When the user actually pressed SOS (may be much earlier than upload) }
    SosUpdate:
      type: object
      properties:
        category: { $ref: "#/components/schemas/Category" }
        text: { type: string }
        people_count: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/SosStatus" }
        score_override:
          type: integer
          minimum: 0
          maximum: 100
          description: Manual score; clears with `null`
        silent: { type: boolean, description: Manually mark/unmark silent }
        note: { type: string, description: Appends internal responder note }
        version: { type: integer, description: Optimistic concurrency; 409 if stale }
    Sos:
      type: object
      required: [id, sender_hash, channel, category, status, score, confidence, approx_location, created_at, last_heard_at]
      properties:
        id: { type: string, format: uuid }
        sender_hash: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        category: { $ref: "#/components/schemas/Category" }
        status: { $ref: "#/components/schemas/SosStatus" }
        approx_location: { $ref: "#/components/schemas/ApproxLocation" }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
          description: Exact GPS — present only for the assigned responder or admin
        text: { type: [string, "null"] }
        people_count: { type: [integer, "null"] }
        score: { type: integer, minimum: 0, maximum: 100 }
        confidence: { $ref: "#/components/schemas/Confidence" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/TriageReason" }
        event_id: { type: [string, "null"], format: uuid }
        has_voice_note: { type: boolean }
        silent: { type: boolean, description: "Contact lost (no heartbeat/message for the silence threshold) or a welfare check-in deadline passed unanswered; priority already boosted. Only a recent heartbeat or an answer clears it, and never lowers the score." }
        silent_since: { type: [string, "null"], format: date-time }
        last_heard_at: { type: string, format: date-time, description: Last message OR heartbeat OR check-in answer from the case's device }
        last_heartbeat_at: { type: [string, "null"], format: date-time, description: The device's last automatic heartbeat }
        connectivity: { $ref: "#/components/schemas/Connectivity" }
        contact_state: { $ref: "#/components/schemas/ContactState" }
        silent_for_seconds: { type: integer, description: Seconds since the device was last heard from (heartbeat or message) }
        welfare_missed: { type: integer, description: Welfare check-ins missed since the person last answered (0 = none) }
        hop: { $ref: "#/components/schemas/HopInfo" }
        merged_into: { type: [string, "null"], format: uuid }
        duplicate_count: { type: integer, description: Number of other reports merged into this case }
        assignment:
          oneOf:
            - $ref: "#/components/schemas/AssignmentSummary"
            - type: "null"
        profile:
          oneOf:
            - $ref: "#/components/schemas/ProfilePublic"
            - type: "null"
          description: "Who the caller is (name, age range, coarse vulnerability flags), visible to every dashboard user. `null` when neither a synced profile nor a mesh `profile_summary` exists. Full details are in `SosDetail.profile_full` (assignee/admin only)."
        synthetic: { type: boolean }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time, description: When the backend got it }
        updated_at: { type: string, format: date-time }
      example:
        id: 0192a7d4-1c2e-7000-8a00-0000000000a1
        sender_hash: 9f2c41ab
        channel: mesh
        category: trapped
        status: reported
        approx_location: { lat: 32.99, lng: -96.75, radius_m: 1000 }
        location: null
        text: "Trapped, 2 people, water rising"
        people_count: 2
        score: 92
        confidence: high
        reasons:
          - { source: rule, text: "Trapped + rising water is always critical", weight: 60 }
          - { source: llm, text: "Mentions oxygen tank", weight: 20 }
        event_id: 0192a000-0000-7000-8000-000000000001
        has_voice_note: false
        silent: false
        silent_since: null
        last_heard_at: "2026-11-07T16:21:00Z"
        last_heartbeat_at: "2026-11-07T16:21:00Z"
        connectivity: connected
        contact_state: connected
        silent_for_seconds: 40
        welfare_missed: 0
        hop: { hop_count: 3, max_hops: 10, hop_path: [A1, B7, C3], gateway_device_id: null, original_created_at: "2026-11-07T16:12:00Z" }
        merged_into: null
        duplicate_count: 0
        assignment: null
        profile:
          { view: public, full_name: Maria Elena Gonzalez, preferred_name: Elena, age_range: "65-79", vulnerability_flags: [elderly, oxygen], has_profile: false, source: mesh_summary, profile_version: 0 }
        synthetic: true
        version: 1
        created_at: "2026-11-07T16:12:00Z"
        received_at: "2026-11-07T16:21:00Z"
        updated_at: "2026-11-07T16:21:00Z"
    SosDetail:
      allOf:
        - $ref: "#/components/schemas/Sos"
        - type: object
          properties:
            profile_full:
              $ref: "#/components/schemas/ProfileFull"
              description: Full profile of the device that filed the case. Present only when the viewer is an admin or the ACTIVE assignee of the case; absent for everyone else (and when no synced profile exists).
            triage: { $ref: "#/components/schemas/Triage" }
            checkins:
              type: array
              items: { $ref: "#/components/schemas/Checkin" }
            events:
              type: array
              items: { $ref: "#/components/schemas/SosEvent" }
            merged_reports:
              type: array
              description: Other reports folded into this case
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  channel: { $ref: "#/components/schemas/Channel" }
                  text: { type: [string, "null"] }
                  hop: { $ref: "#/components/schemas/HopInfo" }
                  created_at: { type: string, format: date-time }
            matched_offers:
              type: array
              items: { $ref: "#/components/schemas/OfferMatch" }
            notes:
              type: array
              items:
                type: object
                properties:
                  responder_id: { type: string, format: uuid }
                  text: { type: string }
                  created_at: { type: string, format: date-time }
    SosPublicStatus:
      type: object
      required: [id, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SosStatus" }
        reached_responders: { type: boolean }
        eta_minutes: { type: [integer, "null"] }
        message: { type: [string, "null"], example: "Help is on the way, ETA 40 min" }
        updated_at: { type: string, format: date-time }
    SosEvent:
      type: object
      required: [id, type, at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [reported, received_via_gateway, triaged, merged, silent_flagged, heartbeat_silent, contact_restored, checkin_sent, checkin_responded, checkin_missed, self_resolved, urgent_help_requested, assigned, en_route, on_scene, resolved, released, note, edited, closed]
        actor:
          type: object
          properties:
            kind: { type: string, enum: [system, responder, victim] }
            id: { type: [string, "null"] }
        data: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }

    # ---- check-ins
    CheckinResponse:
      type: string
      enum: [still_here, no_longer_need_help, need_urgent_help, ok, need_help, other]
      description: |
        `still_here` = "I'm still here" (confirmed, no score change). `no_longer_need_help` = "I no longer need help" (case resolved by the requester, outcome `self_resolved`).
        `need_urgent_help` = "I need help urgently" (+15 score). Legacy: `ok` = still_here, `need_help` = need_urgent_help, `other` = still_here with free text.
    Connectivity:
      type: string
      enum: [connected, quiet, lost_contact, unknown]
      description: |
        Derived from the last contact (automatic heartbeat, or any message from the device). `connected` = heard within 2 heartbeat intervals; `quiet` = later than that but under
        `silence_threshold_seconds`; `lost_contact` = at or over the threshold (the device probably has no connectivity; NOT proof of distress); `unknown` = never heard.
    ContactState:
      type: string
      enum: [connected, lost_contact, unresponsive]
      description: |
        Interpretation for a case: `lost_contact` = heartbeats stopped (probably no connectivity); `unresponsive` = heartbeats still arrive but welfare check-ins go unanswered
        (possible incapacitation, the stronger signal); `connected` = neither.
    Checkin:
      type: object
      description: |
        A welfare check-in: the server asks the person to confirm their status (see "Liveness, layer B"). Delivered as a push notification (when a `push_token` exists), a mesh
        `BackendMessage` `checkin_request`, `pending_checkins` in the heartbeat response and `GET /checkins/pending`. The app sounds a local alarm at `alarm_at` if unanswered.
      required: [id, sos_id, sent_at, channel]
      properties:
        id: { type: string, format: uuid }
        sos_id: { type: string, format: uuid }
        kind: { type: string, enum: [welfare] }
        channel: { $ref: "#/components/schemas/Channel" }
        sent_at: { type: string, format: date-time }
        responded_at: { type: [string, "null"], format: date-time }
        response: { oneOf: [{ $ref: "#/components/schemas/CheckinResponse" }, { type: "null" }] }
        text: { type: [string, "null"] }
        message: { type: [string, "null"], description: Custom text when a responder triggered the check-in }
        choices:
          type: array
          description: The replies the app should offer (render as notification action buttons)
          items: { type: string, enum: [still_here, no_longer_need_help, need_urgent_help] }
        attempt: { type: integer, description: "1-based; grows while check-ins are missed" }
        missed: { type: boolean, description: Deadline passed with no response (the case became silent at that moment) }
        alarm_at: { type: string, format: date-time, description: "App-side final try: if still unanswered at this time, sound an alarm + vibration + full-screen alert. = deadline_at - checkin_alarm_lead_seconds." }
        deadline_at: { type: string, format: date-time, description: Answer by this time; after it the check-in is missed and the case becomes silent (late answers are still accepted) }
      example:
        id: 0192a7f0-0000-7000-8000-0000000000c1
        sos_id: 0192a7d4-1c2e-7000-8a00-0000000000a1
        kind: welfare
        channel: app
        sent_at: "2026-11-07T16:30:00Z"
        responded_at: null
        response: null
        text: null
        choices: [still_here, no_longer_need_help, need_urgent_help]
        attempt: 1
        missed: false
        alarm_at: "2026-11-07T16:34:00Z"
        deadline_at: "2026-11-07T16:35:00Z"
    # ---- assignments
    AssignmentCreate:
      type: object
      required: [sos_id]
      properties:
        sos_id: { type: string, format: uuid }
        responder_id: { type: string, format: uuid }
        eta_minutes: { type: integer, minimum: 0 }
    AssignmentUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/AssignmentStatus" }
        eta_minutes: { type: integer, minimum: 0 }
        responder_id: { type: string, format: uuid, description: Reassign (admin) }
        note: { type: string }
        outcome:
          type: string
          enum: [rescued, safe_on_arrival, false_alarm, unreachable, referred, self_resolved]
          description: Required when status=resolved. `self_resolved` is set by the server when the requester answers a check-in with `no_longer_need_help` (responders normally do not send it).
    AssignmentSummary:
      type: object
      required: [id, responder_id, status]
      properties:
        id: { type: string, format: uuid }
        responder_id: { type: string, format: uuid }
        responder_name: { type: string }
        status: { $ref: "#/components/schemas/AssignmentStatus" }
        eta_minutes: { type: [integer, "null"] }
    Assignment:
      allOf:
        - $ref: "#/components/schemas/AssignmentSummary"
        - type: object
          required: [sos_id, created_at]
          properties:
            sos_id: { type: string, format: uuid }
            eta_at: { type: [string, "null"], format: date-time }
            outcome: { type: [string, "null"], description: "rescued, safe_on_arrival, false_alarm, unreachable, referred, or `self_resolved` (the requester said they no longer need help)" }
            location:
              oneOf:
                - $ref: "#/components/schemas/LatLng"
                - type: "null"
              description: Exact victim location, only for the assignee/admin
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            resolved_at: { type: [string, "null"], format: date-time }

    # ---- responders
    ResponderCreate:
      type: object
      required: [username, password, name, role]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        skills:
          type: array
          items: { type: string, example: boat }
        organization: { type: string, example: State Farm CAT Team }
        phone: { type: string }
    ResponderUpdate:
      type: object
      properties:
        name: { type: string }
        password: { type: string, format: password }
        role: { $ref: "#/components/schemas/Role" }
        skills: { type: array, items: { type: string } }
        available: { type: boolean }
        location: { $ref: "#/components/schemas/LatLng" }
        organization: { type: string }
        phone: { type: string }
    Responder:
      type: object
      required: [id, username, name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        skills: { type: array, items: { type: string } }
        organization: { type: [string, "null"] }
        available: { type: boolean }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
        active_assignments: { type: integer }
        last_seen_at: { type: [string, "null"], format: date-time }

    # ---- offers
    OfferCreate:
      type: object
      required: [kind, lat, lng]
      properties:
        kind: { $ref: "#/components/schemas/OfferKind" }
        description: { type: string, maxLength: 500, example: "I have a 14ft boat, seats 4" }
        capacity: { type: integer, minimum: 1 }
        lat: { type: number }
        lng: { type: number }
        radius_km: { type: number, default: 3, description: How far the offerer will travel }
        expires_at: { type: string, format: date-time }
    OfferUpdate:
      type: object
      properties:
        description: { type: string }
        capacity: { type: integer }
        radius_km: { type: number }
        lat: { type: number }
        lng: { type: number }
        status: { $ref: "#/components/schemas/OfferStatus" }
    Offer:
      type: object
      required: [id, kind, status, approx_location, created_at]
      properties:
        id: { type: string, format: uuid }
        sender_hash: { type: string }
        kind: { $ref: "#/components/schemas/OfferKind" }
        description: { type: string }
        capacity: { type: [integer, "null"] }
        status: { $ref: "#/components/schemas/OfferStatus" }
        approx_location: { $ref: "#/components/schemas/ApproxLocation" }
        radius_km: { type: number }
        match_count: { type: integer }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    OfferMatch:
      type: object
      required: [id, offer_id, sos_id, status, distance_km]
      properties:
        id: { type: string, format: uuid }
        offer_id: { type: string, format: uuid }
        sos_id: { type: string, format: uuid }
        status: { type: string, enum: [suggested, accepted, declined, completed] }
        distance_km: { type: number }
        score: { type: number, description: Match quality 0-1 }
        created_at: { type: string, format: date-time }

    # ---- heartbeats
    HeartbeatStatus:
      type: string
      enum: [active, quiet, distress, stopped, unknown]
      description: "`active` heartbeats arriving; `quiet` missed the threshold (probably no connectivity); `distress` missed it while neighbours still report or with an open SOS; `stopped` event closed or user opted out; `unknown` never heartbeated. Prefer `Device.connectivity`."
    HeartbeatCreate:
      type: object
      description: |
        The automatic liveness beacon. Apps send it in the background every `heartbeat_interval_seconds`, with no user interaction; receiving it IS the check-in.
        Optional fields are backwards compatible: older apps omit them.
      required: [sent_at, approx]
      properties:
        sent_at: { type: string, format: date-time }
        approx: { $ref: "#/components/schemas/ApproxLocation" }
        battery_pct: { type: integer, minimum: 0, maximum: 100 }
        charging: { type: boolean }
        moving: { type: boolean, description: Device appears to be moving }
        seq: { type: integer, description: Monotonic counter so the server can spot gaps }
        transport: { type: string, enum: [direct, mesh], description: "How this heartbeat was sent: `direct` = REST, `mesh` = relayed envelope (server infers `mesh` when hop_count > 0)" }
        network: { type: string, enum: [wifi, cellular, none, unknown], description: "Phone's own network state when it created the heartbeat" }
        peers_nearby: { type: integer, minimum: 0, description: Mesh peers currently in range }
        gateway: { type: boolean, description: Phone currently has internet and is relaying other phones' messages }
        open_sos_ids:
          type: array
          maxItems: 20
          description: Optional hint listing this phone's own unresolved SOS ids; the server does not rely on it
          items: { type: string, format: uuid }
      example:
        sent_at: "2026-11-07T16:25:00Z"
        approx: { lat: 32.99, lng: -96.75, radius_m: 1000 }
        battery_pct: 41
        charging: false
        moving: false
        seq: 17
        transport: direct
        network: wifi
        peers_nearby: 3
        gateway: true
    Heartbeat:
      allOf:
        - $ref: "#/components/schemas/HeartbeatCreate"
        - type: object
          required: [id, device_id, received_at]
          properties:
            id: { type: string, format: uuid }
            device_id: { type: string, format: uuid }
            sender_hash: { type: string }
            received_at: { type: string, format: date-time }
            hop_count: { type: integer }
            hop_path: { type: array, items: { type: string } }
    SilentDevice:
      type: object
      required: [device_id, sender_hash, status, last_heartbeat_at, last_approx]
      properties:
        device_id: { type: string, format: uuid }
        sender_hash: { type: string }
        status: { type: string, enum: [quiet, distress], description: "`quiet` = missed the threshold, probably no connectivity. `distress` = missed it while neighbours still report, or an open SOS exists." }
        connectivity: { $ref: "#/components/schemas/Connectivity", description: "`lost_contact` while flagged; `connected` in the `heartbeat.resumed` payload" }
        last_heartbeat_at: { type: string, format: date-time }
        silent_for_seconds: { type: integer }
        last_approx: { $ref: "#/components/schemas/ApproxLocation" }
        last_battery_pct: { type: [integer, "null"] }
        was_moving: { type: boolean }
        neighbors_active: { type: integer, description: Active devices in the same or adjacent cells (high = this one going quiet is suspicious) }
        open_sos_id: { type: [string, "null"], format: uuid }
        priority_score: { type: integer, minimum: 0, maximum: 100 }
        reason: { type: string, example: "Lost contact: no heartbeat for 35 min (device probably has no connectivity); 12 neighbours in the area still reporting; battery was 9%" }
        acknowledged: { type: boolean }
        flagged_at: { type: string, format: date-time }

    # ---- backend messages + events
    BackendMessage:
      type: object
      description: |
        Backend-signed message carried over the mesh to a specific phone. Relays forward it until `max_hops`/`expires_at`, then drop it.
        Phones verify `signature` with `signing_public_key` from `/server-info`. Signature: ECDSA P-256/SHA-256 (DER, base64) over the canonical JSON of `{id, kind, sos_id, checkin_id (null when absent), body, max_hops, expires_at, created_at}`, i.e. everything except `hop_count`/`hop_path`.
        The addressed phone matches on `sos_id` (or `checkin_id`) against what it sent; `body` contains no personal data beyond what that phone already knows.
      required: [id, kind, sos_id, max_hops, hop_count, expires_at, created_at, signature]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [delivered, checkin_request, status_update]
          description: "`delivered` = your SOS reached responders; `checkin_request` = a welfare check-in: show a notification with the `choices`, sound the alarm at `body.alarm_at`, answer via PATCH /checkins/{id} or a `checkin_reply` envelope; `status_update` = assignment progress (also 'Marked as resolved. Stay safe.')"
        sos_id: { type: string, format: uuid }
        checkin_id: { type: [string, "null"], format: uuid }
        body:
          type: object
          properties:
            status: { $ref: "#/components/schemas/SosStatus" }
            eta_minutes: { type: [integer, "null"] }
            message: { type: [string, "null"], example: "Help is on the way, ETA 40 min" }
            deadline_at: { type: [string, "null"], format: date-time, description: "checkin_request: answer by" }
            alarm_at: { type: [string, "null"], format: date-time, description: "checkin_request: sound the local final-try alarm at this time if unanswered" }
            choices: { type: array, items: { type: string, enum: [still_here, no_longer_need_help, need_urgent_help] }, description: "checkin_request: the replies to offer" }
            title: { type: string, description: "checkin_request: notification title" }
            attempt: { type: integer }
            tier: { type: string, enum: [critical, high, normal] }
        max_hops: { type: integer, minimum: 1, maximum: 10, example: 5 }
        hop_count: { type: integer, default: 0 }
        hop_path: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        signature: { type: string }
      example:
        id: 0192a7e0-5b1c-7000-8a00-0000000000b1
        kind: status_update
        sos_id: 0192a7d4-1c2e-7000-8a00-0000000000a1
        body: { status: en_route, eta_minutes: 40, message: "Help is on the way, ETA 40 min" }
        max_hops: 5
        hop_count: 0
        hop_path: []
        expires_at: "2026-11-07T22:30:00Z"
        created_at: "2026-11-07T16:30:00Z"
        signature: MEUCIQDexample
    EventRegion:
      type: object
      description: |
        The area an event covers. The bounding box fields (`min_lat`, `min_lng`, `max_lat`, `max_lng`) are always
        present and are what older clients read. When `geofence` is given the server validates it and **recomputes
        the bounding box from it**, so the two can never disagree (a client-sent box is ignored in that case).
        The server also uses the geofence: dead zones are only reported for grid cells whose centre lies inside it,
        and the demo helpers (`/mesh/seed`, `/mesh/simulate`) place synthetic cases inside it. SOS messages and
        heartbeats from outside the geofence are still accepted.
      additionalProperties: true
      properties:
        min_lat: { type: number, minimum: -90, maximum: 90 }
        min_lng: { type: number, minimum: -180, maximum: 180 }
        max_lat: { type: number, minimum: -90, maximum: 90 }
        max_lng: { type: number, minimum: -180, maximum: 180 }
        geofence:
          $ref: "#/components/schemas/Geofence"
        circle:
          type: object
          description: Optional hint so an editor can restore a circle. The `geofence` polygon (64 segments) is the source of truth.
          required: [lat, lng, radius_m]
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
            radius_m: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
      example:
        min_lat: 32.70
        min_lng: -96.90
        max_lat: 32.85
        max_lng: -96.70
        geofence:
          type: Polygon
          coordinates: [[[-96.90, 32.70], [-96.70, 32.70], [-96.70, 32.85], [-96.90, 32.85], [-96.90, 32.70]]]
    Geofence:
      type: object
      description: |
        GeoJSON Polygon with exactly one linear ring (no holes), positions as `[lng, lat]`. The ring must be closed
        (first position equals last), have at least 3 distinct vertices and at most 500, stay within valid
        coordinate ranges and must not cross itself. Violations answer 422. Circles are stored as a 64-segment polygon.
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 4
            maxItems: 501
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
    EventCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Hurricane Demo 2026" }
        region:
          $ref: "#/components/schemas/EventRegion"
        retention_days: { type: integer, default: 7, minimum: 0 }
        heartbeat_interval_seconds: { type: integer, default: 300, minimum: 30 }
        silence_threshold_seconds: { type: integer, default: 1200, minimum: 60 }
        synthetic: { type: boolean, description: Demo event; all data is synthetic }
    EventUpdate:
      type: object
      properties:
        name: { type: string }
        region: { $ref: "#/components/schemas/EventRegion" }
        retention_days: { type: integer, minimum: 0 }
        heartbeat_interval_seconds: { type: integer, minimum: 30 }
        silence_threshold_seconds: { type: integer, minimum: 60 }
    Event:
      type: object
      required: [id, name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, closed, purged] }
        region:
          oneOf:
            - $ref: "#/components/schemas/EventRegion"
            - type: "null"
          description: The area the event covers; null when none was set
        retention_days: { type: integer }
        heartbeat_interval_seconds: { type: integer }
        silence_threshold_seconds: { type: integer }
        synthetic: { type: boolean }
        case_count: { type: integer }
        open_case_count: { type: integer }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        purge_at: { type: [string, "null"], format: date-time }
        purged_at: { type: [string, "null"], format: date-time }

    # ---- mesh / map
    MeshStats:
      type: object
      required: [avg_hops, max_hops_seen, waiting_offline, window_minutes]
      properties:
        window_minutes: { type: integer }
        messages_received: { type: integer }
        avg_hops: { type: number }
        longest_chain:
          type: object
          properties:
            hops: { type: integer }
            hop_path: { type: array, items: { type: string } }
            sos_id: { type: [string, "null"], format: uuid }
        max_hops_seen: { type: integer }
        waiting_offline:
          type: integer
          description: Estimate of messages still held on phones (sent but not yet delivered; derived from gateway reports and silence)
        active_gateways: { type: integer }
        by_tier:
          type: object
          additionalProperties: { type: integer }
        median_delivery_delay_seconds: { type: number, description: created_at -> received_at }
        heartbeats:
          type: object
          properties:
            active: { type: integer, description: Devices heard from within the threshold }
            quiet: { type: integer, description: Missed the threshold (probably no connectivity) }
            distress: { type: integer }
            stopped: { type: integer }
            received: { type: integer, description: Heartbeats received in the window }
            connectivity:
              type: object
              description: Devices by derived connectivity
              properties:
                connected: { type: integer }
                quiet: { type: integer }
                lost_contact: { type: integer }
                unknown: { type: integer }
        rejected:
          type: object
          properties:
            bad_signature: { type: integer }
            expired: { type: integer }
            hop_limit_exceeded: { type: integer }
            rate_limited: { type: integer }
    Deadzone:
      type: object
      required: [id, center, radius_m, status, detected_at]
      properties:
        id: { type: string, format: uuid }
        center: { $ref: "#/components/schemas/LatLng" }
        radius_m: { type: integer }
        status: { type: string, enum: [open, being_checked, dismissed] }
        reason: { type: string, example: "No reports or check-ins for 6h; neighbouring cells have 14 active cases" }
        last_activity_at: { type: [string, "null"], format: date-time }
        neighbor_case_count: { type: integer }
        detected_at: { type: string, format: date-time }

    # ---- websocket events (not REST)
    WsFrame:
      type: object
      required: [event, data, ts]
      properties:
        event:
          type: string
          enum: [sos.created, sos.updated, sos.merged, sos.silent, heartbeat.silent, heartbeat.resumed, profile.updated, checkin.sent, checkin.responded, assignment.created, assignment.updated, offer.created, offer.matched, deadzones.updated, mesh.stats, pong]
        ts: { type: string, format: date-time }
        data: {}
      discriminator:
        propertyName: event
      example:
        event: sos.silent
        ts: "2026-11-07T17:02:00Z"
        data: { id: 0192a7d4-1c2e-7000-8a00-0000000000a1, status: reported, silent: true, score: 97 }
    WsEventSos:
      description: "Payload for `sos.created`, `sos.updated`, `sos.silent` (data is a full `Sos`; location redacted per the receiving responder)"
      allOf:
        - $ref: "#/components/schemas/Sos"
    WsEventProfile:
      description: |
        Payload for `profile.updated`: sent to responder sockets when a device that has open cases writes or erases its profile. Public fields only
        (never medical, address, contact...). Refetch the affected cases (`sos_ids`) for updated flags and score; `sos.updated` follows for each.
      allOf:
        - $ref: "#/components/schemas/ProfilePublic"
        - type: object
          required: [device_id, sos_ids]
          properties:
            device_id: { type: string, format: uuid }
            sos_ids: { type: array, items: { type: string, format: uuid }, description: Open cases of that device }
    WsEventSilentDevice:
      description: Payload for `heartbeat.silent` (`connectivity=lost_contact`) and `heartbeat.resumed` (`connectivity=connected`); both are a `SilentDevice`. Informational, no case is implied
      allOf:
        - $ref: "#/components/schemas/SilentDevice"
    WsEventSosMerged:
      description: Payload for `sos.merged`
      type: object
      required: [primary_id, merged_ids]
      properties:
        primary_id: { type: string, format: uuid }
        merged_ids: { type: array, items: { type: string, format: uuid } }
    WsEventCheckin:
      description: Payload for `checkin.sent` / `checkin.responded` (a welfare `Checkin`)
      allOf:
        - $ref: "#/components/schemas/Checkin"
    WsEventAssignment:
      description: Payload for `assignment.created` / `assignment.updated`
      allOf:
        - $ref: "#/components/schemas/Assignment"
    WsEventOffer:
      description: Payload for `offer.created`
      allOf:
        - $ref: "#/components/schemas/Offer"
    WsEventOfferMatched:
      description: Payload for `offer.matched`
      allOf:
        - $ref: "#/components/schemas/OfferMatch"
    WsEventDeadzones:
      description: Payload for `deadzones.updated`
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Deadzone" }
    WsEventMeshStats:
      description: Payload for `mesh.stats` (pushed about every 10 s while connected)
      allOf:
        - $ref: "#/components/schemas/MeshStats"
